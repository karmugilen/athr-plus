name: Prepare APK release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v1.1.15)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: apk-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    # Local publishing works without uploading the signing key to GitHub.
    if: ${{ vars.ATHR_CI_SIGNING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Select stable version tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable version tag'; exit 1; }
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125'
      - name: Install Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Restore original signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ATHR_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Set signing secrets first; see docs/APP-UPDATES.md'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/athr-signing.keystore"
          chmod 600 "$RUNNER_TEMP/athr-signing.keystore"
      - name: Build signed APK and update metadata
        env:
          ATHR_SIGNING_STORE: ${{ runner.temp }}/athr-signing.keystore
          ATHR_SIGNING_STORE_PASSWORD: ${{ secrets.ATHR_SIGNING_STORE_PASSWORD }}
          ATHR_SIGNING_ALIAS: ${{ secrets.ATHR_SIGNING_ALIAS }}
          ATHR_SIGNING_KEY_PASSWORD: ${{ secrets.ATHR_SIGNING_KEY_PASSWORD }}
        run: |
          ./android/gradlew -p android assembleRelease -PathrVersionName="${RELEASE_TAG#v}" --console=plain
          python3 scripts/prepare-release.py android/app/build/outputs/apk/release/app-release.apk
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Release is already published; use a new version")' "$RUNNER_TEMP/release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Athr+ $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" android/app/build/release-upload/* --clobber
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/athr-signing.keystore"
